name: PHP checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2.40.0
        with:
          php-version: '8.5'
          extensions: zip
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Build distribution archive
        run: |
          mkdir -p .build
          git archive --format=zip --output=.build/autowiring.zip HEAD
      - name: Inspect archive and prepare independent consumer
        run: php scripts/check-package.php .build/autowiring.zip
      - name: Install as a production dependency
        run: composer install --working-dir=.build/consumer --no-dev --no-interaction --prefer-dist --no-plugins --no-scripts
      - name: Verify production autoload and dependency isolation
        run: php .build/consumer/smoke.php
